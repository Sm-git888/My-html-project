<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="container">
            <h1>My Website</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contact-section">
        <div class="form-card">
            
            <div class="contact-info-top">
                <p><strong>Email:</strong> support@mywebsite.com | <strong>Phone:</strong> 050-1234567</p>
                <div class="social-links">
                    <a href="#">Facebook</a>
                    <a href="#">Instagram</a>
                    <a href="#">TikTok</a>
                </div>
            </div>
            
            <hr>

            <h2>Send Us a Message</h2>
            <p>Please fill in the form below to get in touch with us.</p>

            <form id="myForm">
                <div class="form-row">
                    <input type="text" id="fullName" placeholder="Full Name" required />
                    <input type="text" id="subject" placeholder="Subject" required />
                </div>
                
                <div class="form-row">
                    <input type="email" id="email" placeholder="Email address" required />
                    <input type="text" id="phone" placeholder="Phone Number" required />
                </div>

                <textarea id="message" placeholder="Message" rows="5" required></textarea>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I've read and agree with <a href="#">Terms of Service</a>
                    </label>
                </div>

                <button type="submit" id="submitBtn">Submit</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 My Website. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
